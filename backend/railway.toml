# Railway deployment config.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# preDeployCommand runs BEFORE the healthcheck window opens.
# Alembic can take 10-30s on first deploy; keeping it out of startCommand
# stops the healthcheck from timing out.
# Runs BEFORE the healthcheck window opens, every deploy.
# seed_playbooks is idempotent (checks-and-skips), safe to run every time.
preDeployCommand = "sh -c 'alembic upgrade head && python -m scripts.seed_playbooks'"

# Railway runs startCommand WITHOUT a shell — so $PORT is literal unless
# we wrap it in sh -c. Do NOT remove the sh -c wrapper.
startCommand = "sh -c 'uvicorn sahay.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*'"

healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[services]]
name = "sahay-api"
